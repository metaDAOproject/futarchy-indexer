    - arguments:
        limit:
          description: ""
          nullable: true
          type: integer
        offset:
          description: ""
          nullable: true
          type: integer
        organization_id:
          description: ""
          nullable: true
          type: integer
      code: "WITH proposals AS (\r\n    SELECT\r\n    \tp.proposal_acct::TEXT,\r\n    \tpd.title::TEXT,\r\n    \tdd.name::TEXT AS dao_name,\r\n    \tdd.slug::TEXT AS dao_slug,\r\n    \tp.ended_at AS ends_at,\r\n    \t'proposal' AS proposal_type,\r\n    \t'0.3' AS version,\r\n    \tp.created_at AS created_at,\r\n    \t''::TEXT AS amm_addr,\r\n    \t'Pending' AS status,\r\n    \tp.pass_threshold_bps AS pass_threshold\r\n    FROM proposals p\r\n    JOIN proposal_details pd ON p.proposal_acct = pd.proposal_acct\r\n    JOIN daos d ON d.dao_acct = p.dao_acct\r\n    JOIN dao_details dd ON dd.dao_id = d.dao_id\r\n\tJOIN organizations o ON o.organization_id = dd.organization_id\r\n    WHERE p.status = 'Pending' AND o.is_hide IS FALSE\r\n    AND ({{organization_id}}::INTEGER IS NULL OR dd.organization_id = {{organization_id}}::INTEGER)\r\n),\r\nmetrics AS (\r\n\tSELECT\r\n\t\tmd.id::TEXT AS proposal_acct,\r\n\t\tmd.title::TEXT,\r\n\t\tdd.name::TEXT AS dao_name,\r\n\t\tdd.slug::TEXT AS dao_slug,\r\n\t\tmd.committee_evaluation AS ends_at,\r\n\t\t'metric' AS proposal_type,\r\n\t\t'0.4' AS version,\r\n\t\tmd.created_at AS created_at,\r\n\t\tmd.amm_addr::TEXT AS amm_addr,\r\n\t\t'Pending' AS status,\r\n\t\tmd.metric_threshold AS pass_threshold\r\n\tFROM v0_4_metric_decisions md\r\n\tJOIN dao_details dd ON dd.dao_id = md.dao_id\r\n\tJOIN organizations o ON o.organization_id = dd.organization_id\r\n\tWHERE completed_at IS NULL AND o.is_hide IS FALSE\r\n\tAND ({{organization_id}}::INTEGER IS NULL OR dd.organization_id = {{organization_id}}::INTEGER)\r\n),\r\nv4proposals AS (\r\n    SELECT\r\n        p.proposal_addr::TEXT AS proposal_acct,\r\n        pd.title::TEXT,\r\n        o.name::TEXT AS dao_name,\r\n        o.slug::TEXT AS dao_slug,\r\n        CASE WHEN \r\n            p.finalized_at IS NOT NULL THEN p.finalized_at\r\n            ELSE p.created_at + CONCAT((p.duration_in_slots / 216000)::TEXT, 'days')::INTERVAL\r\n        END AS ends_at,\r\n        'proposal' AS proposal_type,\r\n        '0.4' AS version,\r\n        p.created_at AS created_at,\r\n        ''::TEXT AS amm_addr,\r\n        'Pending' AS status,\r\n        d.pass_threshold_bps AS pass_threshold\r\n    FROM v0_4_proposals p\r\n    JOIN proposal_details pd ON p.proposal_addr = pd.proposal_acct\r\n    JOIN v0_4_daos d ON p.dao_addr = d.dao_addr\r\n    JOIN organizations o ON d.organization_id = o.organization_id\r\n    WHERE finalized_at IS NULL AND o.is_hide IS FALSE\r\n    AND ({{organization_id}}::INTEGER IS NULL OR o.organization_id = {{organization_id}}::INTEGER)\r\n),\r\ncombined_data AS (\r\n    SELECT \r\n        *,\r\n        COUNT(*) OVER() AS total_rows\r\n    FROM (\r\n        SELECT * FROM proposals \r\n        UNION ALL \r\n        SELECT * FROM metrics \r\n        UNION ALL \r\n        SELECT * FROM v4proposals\r\n    ) as union_result\r\n)\r\nSELECT * FROM combined_data\r\nORDER BY created_at DESC\r\nLIMIT COALESCE({{limit}}::INTEGER, NULL)\r\nOFFSET COALESCE({{offset}}::INTEGER, 0);"
      returns: live_proposals
      root_field_name: live_proposals
    - arguments:
        launch_addr:
          description: The address of the launch
          nullable: false
          type: text
      code: "SELECT\r\n\tL.launch_addr,\r\n    L.unix_timestamp_started,\r\n    (L.seconds_for_launch + L.unix_timestamp_started) as unix_timestamp_ended,\r\n    count(R.*) as num_funders,\r\n    L.committed_amount::NUMERIC as total_funded\r\nFROM\r\n    PUBLIC.V0_4_LAUNCHES L\r\n    LEFT JOIN PUBLIC.V0_4_FUNDING_RECORDS R ON L.LAUNCH_ADDR = R.LAUNCH_ADDR\r\nWHERE\r\n    L.LAUNCH_ADDR = {{launch_addr}}\r\nGROUP BY\r\n\tL.launch_addr,\r\n    L.unix_timestamp_started,\r\n    L.seconds_for_launch"
      returns: live_v0_4_launch_stats
      root_field_name: live_v0_4_launch_stats
    - arguments:
        market_key:
          description: ""
          nullable: false
          type: bigint
      code: "WITH decision_market_data AS (\n\tSELECT\n\t\tamm_addr,\n\t\tCOALESCE(completed_at, committee_evaluation) AS completed_at,\n\t\tcreated_at\n\tFROM v0_4_metric_decisions md\n\tWHERE ({{market_key}}::BIGINT IS NULL OR {{market_key}}::BIGINT = md.id)\n),\n--twap_data AS (\n--\tSELECT\n--\t\t*\n--\tFROM twaps\n--\tWHERE market_acct = (SELECT amm_addr FROM decision_market_data)\n--\tAND created_at >= (SELECT created_at FROM decision_market_data)\n--\tAND created_at <= (SELECT completed_at FROM decision_market_data)\n--),\nprices_1h AS (\n\tSELECT\n\t\tARRAY_AGG(\n\t\t\tJSON_BUILD_ARRAY(price, bucket_time::TEXT)\n\t\t\tORDER BY bucket_time DESC\n\t\t) AS prices\n\tFROM (\n        SELECT \n            time_bucket('60 minutes'::interval, pc.interv) as bucket_time,\n            first(pc.price, pc.interv) AS price\n        FROM decision_market_data dmd\n        LEFT JOIN prices_chart_data pc ON \n            pc.market_acct = dmd.amm_addr\n            AND pc.interv >= dmd.created_at\n            AND pc.interv <= dmd.completed_at\n        GROUP BY bucket_time\n    ) t\n),\nprices_15m AS (\n\tSELECT\n\t\tARRAY_AGG(\n\t\t\tJSON_BUILD_ARRAY(price, bucket_time::TEXT)\n\t\t\tORDER BY bucket_time DESC\n\t\t) AS prices\n\tFROM (\n        SELECT \n            time_bucket('15 minutes'::interval, pc.interv) as bucket_time,\n            first(pc.price, pc.interv) AS price\n        FROM decision_market_data dmd\n        LEFT JOIN prices_chart_data pc ON \n            pc.market_acct = dmd.amm_addr\n            AND pc.interv >= dmd.created_at\n            AND pc.interv <= dmd.completed_at\n        GROUP BY bucket_time\n    ) t\n),\nprices_5m AS (\n\tSELECT\n\t\tARRAY_AGG(\n\t\t\tJSON_BUILD_ARRAY(price, bucket_time::TEXT)\n\t\t\tORDER BY bucket_time DESC\n\t\t) AS prices\n\tFROM (\n        SELECT \n            time_bucket('5 minutes'::interval, pc.interv) as bucket_time,\n            first(pc.price, pc.interv) AS price\n        FROM decision_market_data dmd\n        LEFT JOIN prices_chart_data pc ON \n            pc.market_acct = dmd.amm_addr\n            AND pc.interv >= dmd.created_at\n            AND pc.interv <= dmd.completed_at\n        GROUP BY bucket_time\n    ) t),\nprices_1m AS (\n\tSELECT\n\t\tARRAY_AGG(\n\t\t\tJSON_BUILD_ARRAY(price, bucket_time::TEXT)\n\t\t\tORDER BY bucket_time DESC\n\t\t) AS prices\n\tFROM (\n        SELECT \n            time_bucket('1 minutes'::interval, pc.interv) as bucket_time,\n            first(pc.price, pc.interv) AS price\n        FROM decision_market_data dmd\n        LEFT JOIN prices_chart_data pc ON \n            pc.market_acct = dmd.amm_addr\n            AND pc.interv >= dmd.created_at\n            AND pc.interv <= dmd.completed_at\n        GROUP BY bucket_time\n    ) t\n)\nSELECT json_build_object(\n\t'prices_1m', (SELECT prices FROM prices_1m),\n\t'prices_5m', (SELECT prices FROM prices_5m),\n\t'prices_15m', (SELECT prices FROM prices_15m),\n\t'prices_1h', (SELECT prices FROM prices_1h)\n) AS prices;"
      returns: chart_prices_twap
      root_field_name: metric_market_chart_prices
    - arguments:
        market_acct:
          description: ""
          nullable: true
          type: text
      code: |-
        WITH metric_swaps AS (
            SELECT
                user_addr,
                input_amount,
                output_amount,
                block_time,
                swap_type,
                swap.signature,
                merge.amount AS merge_amount,
                split.amount AS split_amount,
                amm_addr
            FROM v0_4_swaps swap
            LEFT JOIN v0_4_splits split ON split.signature = swap.signature
            LEFT JOIN v0_4_merges merge ON merge.signature = swap.signature
            WHERE (NULLIF({{market_acct}}, '') IS NULL OR swap.amm_addr = {{market_acct}})
        ), splits AS (
        	SELECT
        		CASE WHEN swap_type = 'Sell'
        		THEN 'down'
        		ELSE 'up'
        		END AS asset,
        		output_amount + split_amount AS size,
        		'buy' AS side,
        		input_amount AS base_amount,
        		input_amount / (output_amount + split_amount) AS price,
        		signature,
        		user_addr,
        		block_time,
        		amm_addr
        	FROM metric_swaps WHERE split_amount IS NOT NULL
        ), merges AS (
        	SELECT
        		CASE WHEN swap_type = 'Buy'
        		THEN 'down'
        		ELSE 'up'
        		END AS asset,
        		input_amount + merge_amount AS size,
        		'sell' AS side,
        		output_amount AS base_amount,
        		output_amount / (input_amount + merge_amount) AS price,
        		signature,
        		user_addr,
        		block_time,
        		amm_addr
        	FROM metric_swaps WHERE merge_amount IS NOT NULL
        ), agg AS (
        	SELECT
        		*
        	FROM splits UNION SELECT * FROM merges
        ), calculations AS (
        	SELECT
        		SUM(size) / POWER(10, 6) AS total_size,
        		SUM(base_amount) / POWER(10, 6) AS total_volume,
        		COUNT(*) AS total_trades,
        		COUNT(DISTINCT(user_addr)) AS unique_traders,
        		amm_addr
        	FROM agg
        	GROUP BY amm_addr
        )
        SELECT
        	total_size::NUMERIC,
        	total_volume::NUMERIC,
        	total_trades::NUMERIC,
        	unique_traders::NUMERIC,
        	amm_addr::TEXT
        FROM calculations;
      returns: metric_market_performance_stats
      root_field_name: metric_market_performance_stats
    - arguments:
        market_key:
          description: ""
          nullable: false
          type: bigint
        time_interval:
          description: ""
          nullable: false
          type: interval
      code: "WITH decision_market_data AS (\n\tSELECT\n\t\tamm_addr,\n\t\tCOALESCE(completed_at, committee_evaluation) AS completed_at,\n\t\tcreated_at\n\tFROM v0_4_metric_decisions md\n\tWHERE ({{market_key}}::BIGINT IS NULL OR {{market_key}}::BIGINT = md.id)\n),\nprices_mm AS (\n\tSELECT\n\t\tARRAY_AGG(\n\t\t\tJSON_BUILD_ARRAY(price, bucket_time::TEXT)\n\t\t\tORDER BY bucket_time DESC\n\t\t) AS prices\n\tFROM (\n        SELECT \n            time_bucket({{time_interval}}::interval, pc.interv) as bucket_time,\n            first(pc.price, pc.interv) AS price\n        FROM decision_market_data dmd\n        LEFT JOIN prices_chart_data pc ON \n            pc.market_acct = dmd.amm_addr\n            AND pc.interv >= dmd.created_at\n            AND pc.interv <= dmd.completed_at\n        GROUP BY bucket_time\n    ) t\n)\nSELECT json_build_object(\n\t'prices', (SELECT prices FROM prices_mm)\n) AS prices;"
      returns: chart_prices_twap
      root_field_name: metric_market_price_chart_constrained
    - arguments:
        dao_slug:
          description: ""
          nullable: true
          type: text
        market_acct:
          description: ""
          nullable: true
          type: text
        proposal_acct:
          description: ""
          nullable: true
          type: text
      code: "WITH base_trades AS (\n    SELECT \n        t.market_acct,\n        o.actor_acct,\n        (t.base_amount / POW(10, tokens.decimals)) * t.quote_price AS trade_volume,\n        dd.slug,\n        m.proposal_acct,\n        COUNT(*) OVER () as total_takes  -- Count all takes that match our filters\n    FROM \n        takes t\n        INNER JOIN orders o \n            ON o.order_tx_sig = t.order_tx_sig\n            AND o.market_acct IS NOT NULL \n            AND o.quote_price > 0\n        INNER JOIN transactions tx \n            ON tx.tx_sig = o.order_tx_sig\n            AND tx.failed IS FALSE\n        INNER JOIN markets m \n            ON m.market_acct = o.market_acct\n        INNER JOIN proposals p \n            ON p.proposal_acct = m.proposal_acct\n        INNER JOIN daos d \n            ON d.dao_acct = p.dao_acct\n        INNER JOIN tokens \n            ON tokens.mint_acct = d.base_acct\n        INNER JOIN dao_details dd \n            ON dd.dao_id = d.dao_id\n    WHERE \n        -- Optional filters that can be commented out or dynamically included\n        (NULLIF({{dao_slug}}, '') IS NULL OR dd.slug = {{dao_slug}})\n        AND (NULLIF({{proposal_acct}}, '') IS NULL OR m.proposal_acct = {{proposal_acct}})\n        AND (NULLIF({{market_acct}}, '') IS NULL OR t.market_acct = {{market_acct}})\n),\naggregated_stats AS (\n    SELECT \n        COUNT(DISTINCT actor_acct) AS unique_trader_count,\n        SUM(trade_volume) AS total_volume,\n        MAX(total_takes) AS total_trades,  -- Use MAX since the value is the same for all rows\n        -- Include these in output for verification/grouping if needed\n        NULLIF({{dao_slug}}, '') AS filtered_dao_slug,\n        NULLIF({{proposal_acct}}, '') AS filtered_proposal_acct,\n        NULLIF({{market_acct}}, '') AS filtered_market_acct\n    FROM base_trades\n)\nSELECT \n    total_volume::numeric, \n    unique_trader_count::numeric AS unique_accounts,\n    total_trades::numeric\nFROM aggregated_stats;"
      returns: performance_stats
      root_field_name: performance_stats
    - arguments:
        proposal_acct:
          description: ""
          nullable: false
          type: text
      code: "WITH proposal_data AS (\n    SELECT \n        p.created_at,\n        p.ended_at,\n        p.pass_market_acct,\n        p.fail_market_acct,\n        d.base_acct as spot_market_acct,\n        CASE \n            WHEN p.ended_at IS NULL OR p.ended_at > now() THEN now() - interval '1 hour'\n            ELSE p.ended_at - interval '1 hour'\n        END as recent_1h_start,\n        CASE \n            WHEN p.ended_at IS NULL OR p.ended_at > now() THEN now() - interval '4 hours'\n            ELSE p.ended_at - interval '4 hours'\n        END as recent_4h_start,\n        p.created_at as start_time,\n        CASE \n            WHEN p.ended_at IS NULL OR p.ended_at > now() THEN now()\n            ELSE p.ended_at\n        END as end_time\n    FROM proposals p\n    LEFT JOIN daos d ON p.dao_acct = d.dao_acct\n    WHERE p.proposal_acct = {{proposal_acct}}\n),\npass_15m AS (\n    SELECT array_agg(\n        json_build_array(price, bucket_time::text)\n        ORDER BY bucket_time DESC\n    ) as prices\n    FROM (\n        SELECT \n            time_bucket('15 minutes'::interval, pc.interv) as bucket_time,\n            first(pc.price, pc.interv) AS price\n        FROM proposal_data p\n        LEFT JOIN prices_chart_data pc ON \n            pc.market_acct = p.pass_market_acct\n            AND pc.interv >= p.start_time\n            AND pc.interv <= p.end_time\n        GROUP BY bucket_time\n    ) t\n),\npass_5m AS (\n    SELECT array_agg(\n        json_build_array(price, bucket_time::text)\n        ORDER BY bucket_time DESC\n    ) as prices\n    FROM (\n        SELECT \n            time_bucket('5 minutes'::interval, pc.interv) as bucket_time,\n            first(pc.price, pc.interv) AS price\n        FROM proposal_data p\n        LEFT JOIN prices_chart_data pc ON \n            pc.market_acct = p.pass_market_acct\n            AND pc.interv >= p.recent_4h_start\n            AND pc.interv <= p.end_time\n        GROUP BY bucket_time\n    ) t\n),\npass_1m AS (\n    SELECT array_agg(\n        json_build_array(price, bucket_time::text)\n        ORDER BY bucket_time DESC\n    ) as prices\n    FROM (\n        SELECT \n            time_bucket('1 minute'::interval, pc.interv) as bucket_time,\n            first(pc.price, pc.interv) AS price\n        FROM proposal_data p\n        LEFT JOIN prices_chart_data pc ON \n            pc.market_acct = p.pass_market_acct\n            AND pc.interv >= p.recent_1h_start\n            AND pc.interv <= p.end_time\n        GROUP BY bucket_time\n    ) t\n),\nfail_15m AS (\n    SELECT array_agg(\n        json_build_array(price, bucket_time::text)\n        ORDER BY bucket_time DESC\n    ) as prices\n    FROM (\n        SELECT \n            time_bucket('15 minutes'::interval, pc.interv) as bucket_time,\n            first(pc.price, pc.interv) AS price\n        FROM proposal_data p\n        LEFT JOIN prices_chart_data pc ON \n            pc.market_acct = p.fail_market_acct\n            AND pc.interv >= p.start_time\n            AND pc.interv <= p.end_time\n        GROUP BY bucket_time\n    ) t\n),\nfail_5m AS (\n    SELECT array_agg(\n        json_build_array(price, bucket_time::text)\n        ORDER BY bucket_time DESC\n    ) as prices\n    FROM (\n        SELECT \n            time_bucket('5 minutes'::interval, pc.interv) as bucket_time,\n            first(pc.price, pc.interv) AS price\n        FROM proposal_data p\n        LEFT JOIN prices_chart_data pc ON \n            pc.market_acct = p.fail_market_acct\n            AND pc.interv >= p.recent_4h_start\n            AND pc.interv <= p.end_time\n        GROUP BY bucket_time\n    ) t\n),\nfail_1m AS (\n    SELECT array_agg(\n        json_build_array(price, bucket_time::text)\n        ORDER BY bucket_time DESC\n    ) as prices\n    FROM (\n        SELECT \n            time_bucket('1 minute'::interval, pc.interv) as bucket_time,\n            first(pc.price, pc.interv) AS price\n        FROM proposal_data p\n        LEFT JOIN prices_chart_data pc ON \n            pc.market_acct = p.fail_market_acct\n            AND pc.interv >= p.recent_1h_start\n            AND pc.interv <= p.end_time\n        GROUP BY bucket_time\n    ) t\n),\nspot_15m AS (\n    SELECT array_agg(\n        json_build_array(price, bucket_time::text)\n        ORDER BY bucket_time DESC\n    ) as prices\n    FROM (\n        SELECT \n            time_bucket('15 minutes'::interval, pc.interv) as bucket_time,\n            first(pc.price, pc.interv) AS price\n        FROM proposal_data p\n        LEFT JOIN prices_chart_data pc ON \n            pc.market_acct = p.spot_market_acct\n            AND pc.interv >= p.start_time\n            AND pc.interv <= p.end_time\n        GROUP BY bucket_time\n    ) t\n),\nspot_5m AS (\n    SELECT array_agg(\n        json_build_array(price, bucket_time::text)\n        ORDER BY bucket_time DESC\n    ) as prices\n    FROM (\n        SELECT \n            time_bucket('5 minutes'::interval, pc.interv) as bucket_time,\n            first(pc.price, pc.interv) AS price\n        FROM proposal_data p\n        LEFT JOIN prices_chart_data pc ON \n            pc.market_acct = p.spot_market_acct\n            AND pc.interv >= p.recent_4h_start\n            AND pc.interv <= p.end_time\n        GROUP BY bucket_time\n    ) t\n),\nspot_1m AS (\n    SELECT array_agg(\n        json_build_array(price, bucket_time::text)\n        ORDER BY bucket_time DESC\n    ) as prices\n    FROM (\n        SELECT \n            time_bucket('1 minute'::interval, pc.interv) as bucket_time,\n            first(pc.price, pc.interv) AS price\n        FROM proposal_data p\n        LEFT JOIN prices_chart_data pc ON \n            pc.market_acct = p.spot_market_acct\n            AND pc.interv >= p.recent_1h_start\n            AND pc.interv <= p.end_time\n        GROUP BY bucket_time\n    ) t\n)\nSELECT json_build_object(\n    'pass_15m', (SELECT prices FROM pass_15m),\n    'pass_5m', (SELECT prices FROM pass_5m),\n    'pass_1m', (SELECT prices FROM pass_1m),\n    'fail_15m', (SELECT prices FROM fail_15m),\n    'fail_5m', (SELECT prices FROM fail_5m),\n    'fail_1m', (SELECT prices FROM fail_1m),\n    'spot_15m', (SELECT prices FROM spot_15m),\n    'spot_5m', (SELECT prices FROM spot_5m),\n    'spot_1m', (SELECT prices FROM spot_1m)\n) as prices;"
      returns: chart_prices
      root_field_name: proposal_chart_prices
    - arguments:
        proposal_acct:
          description: ""
          nullable: false
          type: text
      code: "WITH v0_3_proposals AS (\r\n    SELECT \r\n        p.created_at,\r\n        p.ended_at,\r\n        p.pass_market_acct,\r\n        p.fail_market_acct,\r\n        d.base_acct as spot_market_acct,\r\n        tq.decimals AS quote_decimals,\r\n        tb.decimals AS base_decimals,\r\n        POWER(10, ABS(tq.decimals - tb.decimals)) AS scalar,\r\n        CASE \r\n            WHEN p.ended_at IS NULL OR p.ended_at > now() THEN now() - interval '1 hour'\r\n            ELSE p.ended_at - interval '1 hour'\r\n        END as recent_1h_start,\r\n        CASE \r\n            WHEN p.ended_at IS NULL OR p.ended_at > now() THEN now() - interval '4 hours'\r\n            ELSE p.ended_at - interval '4 hours'\r\n        END as recent_4h_start,\r\n        p.created_at as start_time,\r\n        CASE \r\n            WHEN p.ended_at IS NULL OR p.ended_at > now() THEN now()\r\n            ELSE p.ended_at\r\n        END as end_time\r\n    FROM proposals p\r\n    LEFT JOIN daos d ON p.dao_acct = d.dao_acct\r\n    LEFT JOIN tokens tb ON tb.mint_acct = d.quote_acct\r\n    LEFT JOIN tokens tq ON tq.mint_acct = d.base_acct\r\n    WHERE p.proposal_acct = {{proposal_acct}}\r\n),\r\nv0_4_proposals AS (\r\n    SELECT \r\n        p.created_at,\r\n        p.finalized_at as ended_at,\r\n        p.pass_amm_addr as pass_market_acct,\r\n        p.fail_amm_addr as fail_market_acct,\r\n        d.token_mint_acct as spot_market_acct,\r\n        tq.decimals AS quote_decimals,\r\n        tb.decimals AS base_decimals,\r\n        POWER(10, ABS(tq.decimals - tb.decimals)) AS scalar,\r\n        CASE \r\n            WHEN p.finalized_at IS NULL OR p.finalized_at > now() THEN now() - interval '1 hour'\r\n            ELSE p.finalized_at - interval '1 hour'\r\n        END as recent_1h_start,\r\n        CASE \r\n            WHEN p.finalized_at IS NULL OR p.finalized_at > now() THEN now() - interval '4 hours'\r\n            ELSE p.finalized_at - interval '4 hours'\r\n        END as recent_4h_start,\r\n        p.created_at as start_time,\r\n        CASE \r\n            WHEN p.finalized_at IS NULL OR p.finalized_at > now() THEN now()\r\n            ELSE p.finalized_at\r\n        END as end_time\r\n    FROM v0_4_proposals p\r\n    LEFT JOIN v0_4_daos d ON p.dao_addr = d.dao_addr\r\n    LEFT JOIN tokens tb ON tb.mint_acct = d.usdc_mint_acct\r\n    LEFT JOIN tokens tq ON tq.mint_acct = d.token_mint_acct\r\n    WHERE p.proposal_addr = {{proposal_acct}}\r\n),\r\nproposal_data AS (\r\n\tselect * from v0_3_proposals\r\n\tunion all\r\n\tselect * from v0_4_proposals\r\n),\r\nfail_price_data AS (\r\n    SELECT\r\n        pc.interv AS interv,\r\n        pc.price AS price\r\n    FROM proposal_data p\r\n    LEFT JOIN prices_chart_data pc ON\r\n        pc.market_acct = p.fail_market_acct\r\n        AND pc.interv >= p.start_time\r\n        AND pc.interv <= p.end_time\r\n),\r\npass_twap_data AS (\r\n    SELECT\r\n    \tCASE\r\n\t        WHEN p.quote_decimals > p.base_decimals\r\n\t    \tTHEN (t.token_amount * p.scalar)\r\n\t    \tELSE (t.token_amount / p.scalar)\r\n\t    END / POWER(10, 12) AS price,\r\n        t.interv AS interv\r\n    FROM proposal_data p\r\n    LEFT JOIN twaps_chart_data t ON\r\n        t.market_acct = p.pass_market_acct\r\n        AND t.interv >= p.start_time\r\n        AND t.interv <= p.end_time\r\n),\r\nfail_twap_data AS (\r\n    SELECT\r\n        CASE\r\n\t        WHEN p.quote_decimals > p.base_decimals\r\n\t    \tTHEN (t.token_amount * p.scalar)\r\n\t    \tELSE (t.token_amount / p.scalar)\r\n\t    END / POWER(10, 12) AS price,\r\n        t.interv AS interv\r\n    FROM proposal_data p\r\n    LEFT JOIN twaps_chart_data t ON\r\n        t.market_acct = p.fail_market_acct\r\n        AND t.interv >= p.start_time\r\n        AND t.interv <= p.end_time\r\n),\r\npass_15m AS (\r\n    SELECT array_agg(\r\n        json_build_array(price, bucket_time::text)\r\n        ORDER BY bucket_time DESC\r\n    ) as prices\r\n    FROM (\r\n        SELECT \r\n            time_bucket('15 minutes'::interval, pc.interv) as bucket_time,\r\n            first(pc.price, pc.interv) AS price\r\n        FROM proposal_data p\r\n\t    LEFT JOIN prices_chart_data pc ON\r\n\t        pc.market_acct = p.pass_market_acct\r\n\t        AND pc.interv >= p.start_time\r\n\t        AND pc.interv <= p.end_time\r\n        GROUP BY bucket_time\r\n    ) t\r\n),\r\npass_5m AS (\r\n    SELECT array_agg(\r\n        json_build_array(price, bucket_time::text)\r\n        ORDER BY bucket_time DESC\r\n    ) as prices\r\n    FROM (\r\n        SELECT \r\n            time_bucket('5 minutes'::interval, pc.interv) as bucket_time,\r\n            first(pc.price, pc.interv) AS price\r\n        FROM proposal_data p\r\n\t    LEFT JOIN prices_chart_data pc ON\r\n\t        pc.market_acct = p.pass_market_acct\r\n\t        AND pc.interv >= p.recent_4h_start\r\n\t        AND pc.interv <= p.end_time\r\n        GROUP BY bucket_time\r\n    ) t\r\n),\r\npass_1m AS (\r\n    SELECT array_agg(\r\n        json_build_array(price, bucket_time::text)\r\n        ORDER BY bucket_time DESC\r\n    ) as prices\r\n    FROM (\r\n        SELECT \r\n            time_bucket('1 minute'::interval, pc.interv) as bucket_time,\r\n            first(pc.price, pc.interv) AS price\r\n        FROM proposal_data p\r\n\t    LEFT JOIN prices_chart_data pc ON\r\n\t        pc.market_acct = p.pass_market_acct\r\n\t        AND pc.interv >= p.recent_1h_start\r\n\t        AND pc.interv <= p.end_time\r\n        GROUP BY bucket_time\r\n    ) t\r\n),\r\nfail_15m AS (\r\n    SELECT array_agg(\r\n        json_build_array(price, bucket_time::text)\r\n        ORDER BY bucket_time DESC\r\n    ) as prices\r\n    FROM (\r\n        SELECT \r\n            time_bucket('15 minutes'::interval, pc.interv) as bucket_time,\r\n            first(pc.price, pc.interv) AS price\r\n        FROM proposal_data p\r\n\t    LEFT JOIN prices_chart_data pc ON\r\n\t        pc.market_acct = p.fail_market_acct\r\n\t        AND pc.interv >= p.start_time\r\n\t        AND pc.interv <= p.end_time\r\n        GROUP BY bucket_time\r\n    ) t\r\n),\r\nfail_5m AS (\r\n    SELECT array_agg(\r\n        json_build_array(price, bucket_time::text)\r\n        ORDER BY bucket_time DESC\r\n    ) as prices\r\n    FROM (\r\n        SELECT \r\n            time_bucket('5 minutes'::interval, pc.interv) as bucket_time,\r\n            first(pc.price, pc.interv) AS price\r\n        FROM proposal_data p\r\n\t    LEFT JOIN prices_chart_data pc ON\r\n\t        pc.market_acct = p.fail_market_acct\r\n\t        AND pc.interv >= p.recent_4h_start\r\n\t        AND pc.interv <= p.end_time\r\n        GROUP BY bucket_time\r\n    ) t\r\n),\r\nfail_1m AS (\r\n    SELECT array_agg(\r\n        json_build_array(price, bucket_time::text)\r\n        ORDER BY bucket_time DESC\r\n    ) as prices\r\n    FROM (\r\n        SELECT \r\n            time_bucket('1 minute'::interval, pc.interv) as bucket_time,\r\n            first(pc.price, pc.interv) AS price\r\n        FROM proposal_data p\r\n\t    LEFT JOIN prices_chart_data pc ON\r\n\t        pc.market_acct = p.fail_market_acct\r\n\t        AND pc.interv >= p.recent_1h_start\r\n\t        AND pc.interv <= p.end_time\r\n        GROUP BY bucket_time\r\n    ) t\r\n),\r\nspot_15m AS (\r\n    SELECT array_agg(\r\n        json_build_array(price, bucket_time::text)\r\n        ORDER BY bucket_time DESC\r\n    ) as prices\r\n    FROM (\r\n        SELECT \r\n            time_bucket('15 minutes'::interval, pc.interv) as bucket_time,\r\n            first(pc.price, pc.interv) AS price\r\n        FROM proposal_data p\r\n\t    LEFT JOIN prices_chart_data pc ON\r\n\t        pc.market_acct = p.spot_market_acct\r\n\t        AND pc.interv >= p.start_time\r\n\t        AND pc.interv <= p.end_time\r\n        GROUP BY bucket_time\r\n    ) t\r\n),\r\nspot_5m AS (\r\n    SELECT array_agg(\r\n        json_build_array(price, bucket_time::text)\r\n        ORDER BY bucket_time DESC\r\n    ) as prices\r\n    FROM (\r\n        SELECT \r\n            time_bucket('5 minutes'::interval, pc.interv) as bucket_time,\r\n            first(pc.price, pc.interv) AS price\r\n        FROM proposal_data p\r\n\t    LEFT JOIN prices_chart_data pc ON\r\n\t        pc.market_acct = p.spot_market_acct\r\n\t        AND pc.interv >= p.recent_4h_start\r\n\t        AND pc.interv <= p.end_time\r\n        GROUP BY bucket_time\r\n    ) t\r\n),\r\nspot_1m AS (\r\n    SELECT array_agg(\r\n        json_build_array(price, bucket_time::text)\r\n        ORDER BY bucket_time DESC\r\n    ) as prices\r\n    FROM (\r\n        SELECT \r\n            time_bucket('1 minute'::interval, pc.interv) as bucket_time,\r\n            first(pc.price, pc.interv) AS price\r\n        FROM proposal_data p\r\n\t    LEFT JOIN prices_chart_data pc ON\r\n\t        pc.market_acct = p.spot_market_acct\r\n\t        AND pc.interv >= p.recent_1h_start\r\n\t        AND pc.interv <= p.end_time\r\n        GROUP BY bucket_time\r\n    ) t\r\n),\r\npass_twap_15m AS (\r\n    SELECT array_agg(\r\n        json_build_array(price, bucket_time::text)\r\n        ORDER BY bucket_time DESC\r\n    ) as prices\r\n    FROM (\r\n        SELECT \r\n            time_bucket('15 minutes'::interval, ptd.interv) as bucket_time,\r\n            first(ptd.price, ptd.interv) AS price\r\n        FROM pass_twap_data ptd\r\n        GROUP BY bucket_time\r\n    ) t\r\n),\r\nfail_twap_15m AS (\r\n    SELECT array_agg(\r\n        json_build_array(price, bucket_time::text)\r\n        ORDER BY bucket_time DESC\r\n    ) as prices\r\n    FROM (\r\n        SELECT \r\n            time_bucket('15 minutes'::interval, ftd.interv) as bucket_time,\r\n            first(ftd.price, ftd.interv) AS price\r\n        FROM fail_twap_data ftd\r\n        GROUP BY bucket_time\r\n    ) t\r\n)\r\nSELECT json_build_object(\r\n    'pass_15m', (SELECT prices FROM pass_15m),\r\n    'pass_5m', (SELECT prices FROM pass_5m),\r\n    'pass_1m', (SELECT prices FROM pass_1m),\r\n    'fail_15m', (SELECT prices FROM fail_15m),\r\n    'fail_5m', (SELECT prices FROM fail_5m),\r\n    'fail_1m', (SELECT prices FROM fail_1m),\r\n    'spot_15m', (SELECT prices FROM spot_15m),\r\n    'spot_5m', (SELECT prices FROM spot_5m),\r\n    'spot_1m', (SELECT prices FROM spot_1m),\r\n    'pass_twap_15m', (SELECT prices FROM pass_twap_15m),\r\n    'fail_twap_15m', (SELECT prices FROM fail_twap_15m)\r\n) as prices;"
      returns: chart_prices_twap
      root_field_name: proposal_chart_prices_w_twap
    - arguments:
        proposal_acct:
          description: ""
          nullable: false
          type: text
      code: "SELECT \n    t.order_tx_sig::text,\n    t.base_amount,\n    t.quote_price,\n    t.market_acct::text,\n    t.order_time,\n    o.actor_acct::text,\n    o.side::text,\n    CASE \n        WHEN t.market_acct = p.pass_market_acct THEN 'pass'\n        ELSE 'fail'\n    END as market_type\nFROM \n    takes t\n    INNER JOIN orders o \n        ON o.order_tx_sig = t.order_tx_sig\n        AND o.market_acct IS NOT NULL \n    INNER JOIN proposals p \n        ON (t.market_acct = p.pass_market_acct \n            OR t.market_acct = p.fail_market_acct)\n    INNER JOIN transactions tx \n        ON tx.tx_sig = o.order_tx_sig\n        AND tx.failed IS FALSE\nWHERE \n    p.proposal_acct = {{proposal_acct}}\nORDER BY t.order_time DESC;"
      returns: trades
      root_field_name: proposal_trades
    - arguments:
        dao_slug:
          description: Slug of the DAO
          nullable: false
          type: text
      code: "select up.user_acct::TEXT, sum(up.total_volume)::BIGINT as \"total_volume\" from user_performance up\r\njoin proposals p on up.proposal_acct = p.proposal_acct \r\njoin daos d on p.dao_acct = d.dao_acct\r\njoin dao_details dd on dd.dao_id = d.dao_id \r\nwhere dd.slug = {{dao_slug}}\r\ngroup by dd.slug, up.user_acct\r\norder by sum(up.total_volume) desc;"
      returns: dao_trader
      root_field_name: top_dao_traders
    - arguments:
        end_date:
          description: ""
          nullable: true
          type: text
        market_acct:
          description: ""
          nullable: false
          type: text
        start_date:
          description: ""
          nullable: true
          type: text
      code: "WITH changes AS (\n  SELECT \n    *,\n    LAG(price) OVER w AS prev_price,\n    LAG(prices_type) OVER w AS prev_prices_type,\n    LAG(base_amount) OVER w AS prev_base_amount,\n    LAG(quote_amount) OVER w AS prev_quote_amount,\n    LEAD(price) OVER w AS next_price,\n    LEAD(prices_type) OVER w AS next_prices_type,\n    LEAD(base_amount) OVER w AS next_base_amount,\n    LEAD(quote_amount) OVER w AS next_quote_amount\n  FROM prices_chart_data\n  WHERE market_acct = {{market_acct}}\n    AND ({{start_date}}::timestamptz IS NULL OR interv >= {{start_date}}::timestamptz)\n    AND ({{end_date}}::timestamptz IS NULL OR interv <= {{end_date}}::timestamptz)\n  WINDOW w AS (ORDER BY interv)\n)\nSELECT interv::timestamptz, price::numeric, base_amount::numeric, quote_amount::numeric, prices_type::text\nFROM changes\nWHERE \n  -- First row\n  prev_price IS NULL\n  -- Last row\n  OR next_price IS NULL\n  -- Or where any value changes\n  OR price != prev_price\n  OR prices_type != prev_prices_type\n  OR base_amount != prev_base_amount\n  OR quote_amount != prev_quote_amount;"
      returns: price_chart_data_unique
      root_field_name: unique_price_chart_data
    - arguments:
        end_date:
          description: ""
          nullable: true
          type: text
        proposal_acct:
          description: ""
          nullable: false
          type: text
        start_date:
          description: ""
          nullable: true
          type: text
      code: "WITH changes AS (\n  SELECT \n    *,\n    LAG(pass_price) OVER w AS prev_pass_price,\n    LAG(pass_base_amount) OVER w AS prev_pass_base_amount,\n    LAG(pass_quote_amount) OVER w AS prev_pass_quote_amount,\n    LAG(fail_price) OVER w AS prev_fail_price,\n    LAG(fail_base_amount) OVER w AS prev_fail_base_amount,\n    LAG(fail_quote_amount) OVER w AS prev_fail_quote_amount,\n    LEAD(pass_price) OVER w AS next_pass_price,\n    LEAD(pass_base_amount) OVER w AS next_pass_base_amount,\n    LEAD(pass_quote_amount) OVER w AS next_pass_quote_amount,\n    LEAD(fail_price) OVER w AS next_fail_price,\n    LEAD(fail_base_amount) OVER w AS next_fail_base_amount,\n    LEAD(fail_quote_amount) OVER w AS next_fail_quote_amount\n  FROM proposal_bars\n  WHERE proposal_acct = {{proposal_acct}}\n    AND ({{start_date}}::timestamptz IS NULL OR bar_start_time >= {{start_date}}::timestamptz)\n    AND ({{end_date}}::timestamptz IS NULL OR bar_start_time <= {{end_date}}::timestamptz)\n  WINDOW w AS (ORDER BY bar_start_time)\n), agg AS(\nSELECT \n  proposal_acct::text, bar_size, bar_start_time::timestamptz,\n  pass_market_acct::text, pass_price::numeric, pass_base_amount::numeric, pass_quote_amount::numeric,\n  fail_market_acct::text, fail_price::numeric, fail_base_amount::numeric, fail_quote_amount::numeric\nFROM changes\nWHERE \n  -- First row - no previous values\n  prev_pass_price IS NULL\n\n  -- Last row - no next values\n  OR next_pass_price IS NULL\n\n  -- Price changes - handle nulls in both current and previous\n  OR (pass_price IS NULL AND prev_pass_price IS NOT NULL)\n  OR (pass_price IS NOT NULL AND prev_pass_price IS NULL)\n  OR (pass_price != prev_pass_price AND pass_price IS NOT NULL AND prev_pass_price IS NOT NULL)\n\n  -- Quote amount changes\n  OR (pass_quote_amount IS NULL AND prev_pass_quote_amount IS NOT NULL)\n  OR (pass_quote_amount IS NOT NULL AND prev_pass_quote_amount IS NULL)\n  OR (pass_quote_amount != prev_pass_quote_amount AND pass_quote_amount IS NOT NULL AND prev_pass_quote_amount IS NOT NULL)\n\n  -- Base amount changes\n  OR (pass_base_amount IS NULL AND prev_pass_base_amount IS NOT NULL)\n  OR (pass_base_amount IS NOT NULL AND prev_pass_base_amount IS NULL)\n  OR (pass_base_amount != prev_pass_base_amount AND pass_base_amount IS NOT NULL AND prev_pass_base_amount IS NOT NULL)\n)\nSELECT * FROM agg WHERE pass_price IS NOT NULL AND fail_price IS NOT NULL;"
      returns: proposal_bars_unique
      root_field_name: unique_proposal_bars_data
    - arguments:
        proposal_acct:
          description: ""
          nullable: true
          type: varchar
      code: "WITH market_actors AS (\n    SELECT \n      t.market_acct,\n      o.actor_acct,\n      COUNT(*) AS countOrders\n    FROM \n      takes t\n    JOIN orders o ON o.order_tx_sig = t.order_tx_sig\n    JOIN transactions tx ON tx.tx_sig = o.order_tx_sig\n    WHERE tx.failed IS FALSE\n    AND o.quote_price > 0\n    GROUP BY \n      t.market_acct, o.actor_acct\n), distinct_users_by_proposal AS (\n    SELECT\n        proposal_acct,\n        COUNT(DISTINCT actor_acct) AS uniqueUsersCount,\n        SUM(countOrders) AS totalTrades\n    FROM market_actors\n    JOIN markets ON markets.market_acct = market_actors.market_acct\n    GROUP BY proposal_acct\n)\nSELECT\n\tproposal_acct,\n\tuniqueUsersCount AS user_count,\n\ttotalTrades AS trade_count\nFROM distinct_users_by_proposal\nWHERE \n    CASE \n        WHEN {{proposal_acct}} IS NOT NULL \n            THEN proposal_acct = {{proposal_acct}} \n        ELSE 1 = 1 \n    END;"
      returns: proposal_statistics
      root_field_name: user_count_and_trade_count_per_proposal
    - arguments:
        organization_slug:
          description: ""
          nullable: false
          type: text
      code: |-
        WITH proposal_markets AS (
            SELECT
                m.market_acct,
                m.proposal_acct,
                CASE
                	WHEN p.fail_market_acct = m.market_acct
                	THEN 'fail'
                	WHEN p.pass_market_acct = m.market_acct
                	THEN 'pass'
                END AS market_side,
                t.decimals AS decimals
            FROM markets m
            JOIN proposals p ON p.proposal_acct = m.proposal_acct
            JOIN daos d ON d.dao_acct = p.dao_acct
            JOIN organizations o ON o.organization_id = d.organization_id
            JOIN tokens t ON t.mint_acct = d.base_acct
            WHERE m.proposal_acct IS NOT NULL
            AND ({{organization_slug}}::TEXT IS NULL OR o.slug = {{organization_slug}}::TEXT)
        ), proposal_orders AS (
            SELECT
                orders.actor_acct,
                orders.market_acct AS market_acct,
                orders.side AS side,
                orders.filled_base_amount AS order_amount,
                orders.quote_price AS order_price,
                pm.proposal_acct AS proposal_acct,
                pm.market_side AS market_side,
                takes.base_amount AS trade_amount,
                takes.quote_price AS trade_price,
                takes.base_decimals AS trade_base_decimals,
                takes.order_tx_sig AS tx_sig,
                pm.decimals AS decimals
            FROM orders
            LEFT JOIN takes ON orders.order_tx_sig = takes.order_tx_sig
            JOIN proposal_markets pm ON pm.market_acct = orders.market_acct
        ), proposal_trades_stats AS (
            SELECT
                market_acct,
                actor_acct,
                COUNT(*) AS trade_count,
                SUM(order_price * trade_amount / POWER(10, decimals)) AS volume,
                proposal_acct,
                market_side
            FROM proposal_orders
            WHERE tx_sig IS NOT NULL
            GROUP BY market_acct, actor_acct, proposal_acct, market_side
        ), v04_proposal_markets AS (
        	SELECT
        		vp.fail_amm_addr AS market_acct,
        		vp.proposal_addr AS proposal_acct,
        		'fail' AS market_side,
        		vp.dao_addr AS dao_acct
        	FROM proposal_details pd
        	JOIN v0_4_proposals vp ON pd.proposal_acct = vp.proposal_addr
        	UNION
        	SELECT
        		vp.pass_amm_addr AS market_acct,
        		vp.proposal_addr AS proposal_acct,
        		'pass' AS market_side,
        		vp.dao_addr AS dao_acct
        	FROM proposal_details pd
        	JOIN v0_4_proposals vp ON pd.proposal_acct = vp.proposal_addr
        ), usdc_decimals AS (
        	SELECT
        		t.decimals,
        		d.dao_addr AS dao_acct,
        		o.slug AS slug
        	FROM v0_4_daos d
        	JOIN tokens t ON d.usdc_mint_acct = t.mint_acct
        	JOIN organizations o ON o.organization_id = d.organization_id
        	WHERE ({{organization_slug}}::TEXT IS NULL OR o.slug = {{organization_slug}}::TEXT)
        ), amms_with_decimals AS (
        	SELECT
        		*
        	FROM v04_proposal_markets vp
        	JOIN usdc_decimals ud ON vp.dao_acct = ud.dao_acct
        ), v04_proposal_swaps AS (
        	SELECT
        		vs.amm_addr AS market_acct,
        		vs.user_addr AS actor_acct,
        		CASE
        			WHEN vs.swap_type = 'Buy' THEN vs.input_amount
        			ELSE vs.output_amount
        		END / POW(10, amd.decimals) AS trade_volume,
        		amd.market_side,
        		amd.proposal_acct,
        		amd.slug
        	FROM v0_4_swaps vs
        	JOIN amms_with_decimals amd ON amd.market_acct = vs.amm_addr
        ), v04_proposal_trade_stats AS (
        	SELECT
        		market_acct,
        		actor_acct,
        		COUNT(*) AS trade_count,
        		SUM(trade_volume) AS volume,
        		proposal_acct,
        		market_side
        	FROM v04_proposal_swaps
        	GROUP BY market_acct, actor_acct, proposal_acct, market_side
        ), union_group AS (
        	SELECT
        	* FROM v04_proposal_trade_stats
        	UNION
        	SELECT
        	*
        	FROM proposal_trades_stats
        )
        SELECT
            actor_acct::TEXT AS user_acct,
            trade_count::BIGINT AS total_trades,
            volume::NUMERIC AS total_volume,
            market_acct::TEXT AS market_acct,
            market_side::TEXT AS market_side,
            proposal_acct::TEXT AS proposal_acct
        FROM union_group ORDER BY volume DESC;
      returns: organization_proposal_user_trade_volume
      root_field_name: user_proposal_organization_volume
    - arguments:
        user_acct:
          description: ""
          nullable: true
          type: text
      code: "SELECT \n  up.user_acct::TEXT,\n  up.proposal_acct::TEXT,\n  p.completed_at::TIMESTAMPTZ,\n  pd.title::TEXT,\n  p.status::TEXT,\n  dd.name::TEXT AS dao_name\nFROM user_performance up\nJOIN proposal_details pd ON pd.proposal_acct = up.proposal_acct\nJOIN proposals p ON up.proposal_acct = p.proposal_acct\nJOIN daos d ON d.dao_acct = p.dao_acct\nJOIN dao_details dd ON dd.dao_id = d.dao_id\nWHERE \n  ({{user_acct}}::TEXT IS NULL OR user_acct = {{user_acct}}::TEXT)"
      returns: user_proposals_traded
      root_field_name: users_proposals
    - arguments:
        market_acct:
          description: ""
          nullable: true
          type: text
        organization_slug:
          description: ""
          nullable: true
          type: text
        proposal_acct:
          description: ""
          nullable: true
          type: text
      code: "WITH base_trades AS (\n    SELECT \n        s.amm_addr AS market_acct,\n        s.user_addr AS actor_acct,\n        CASE \n         WHEN s.swap_type = 'Buy' \n         \tTHEN (s.input_amount / POW(10, tokens.decimals))\n         ELSE (s.output_amount / POW(10, tokens.decimals))\n        END AS trade_volume,\n        o.slug,\n        p.proposal_addr,\n        COUNT(*) OVER () as total_takes\n    FROM \n        v0_4_swaps s\n        INNER JOIN v0_4_amms m \n            ON m.amm_addr = s.amm_addr\n        INNER JOIN v0_4_proposals p \n            ON p.pass_amm_addr = m.amm_addr OR p.fail_amm_addr = m.amm_addr\n        INNER JOIN v0_4_daos d \n            ON d.dao_addr = p.dao_addr\n        INNER JOIN tokens \n            ON tokens.mint_acct = d.usdc_mint_acct\n        INNER JOIN organizations o \n            ON o.organization_id = d.organization_id\n    WHERE \n        -- Optional filters that can be commented out or dynamically included\n        (NULLIF({{organization_slug}}, '') IS NULL OR o.slug = {{organization_slug}})\n        AND (NULLIF({{proposal_acct}}, '') IS NULL OR p.proposal_addr = {{proposal_acct}})\n        AND (NULLIF({{market_acct}}, '') IS NULL OR m.amm_addr = {{market_acct}})\n),\naggregated_stats AS (\n    SELECT \n        COUNT(DISTINCT actor_acct) AS unique_trader_count,\n        SUM(trade_volume) AS total_volume,\n        MAX(total_takes) AS total_trades,  -- Use MAX since the value is the same for all rows\n        -- Include these in output for verification/grouping if needed\n        NULLIF({{organization_slug}}, '') AS filtered_org_slug,\n        NULLIF({{proposal_acct}}, '') AS filtered_proposal_acct,\n        NULLIF({{market_acct}}, '') AS filtered_market_acct\n    FROM base_trades\n)\nSELECT \n    total_volume::numeric, \n    unique_trader_count::numeric AS unique_accounts,\n    total_trades::numeric\nFROM aggregated_stats;"
      returns: performance_stats
      root_field_name: v0_4_performance_stats
    - arguments: {}
      code: "WITH base_trades AS (\n    SELECT \n        t.market_acct,\n        o.actor_acct,\n        (t.base_amount / POW(10, tokens.decimals)) * t.quote_price AS trade_volume,\n        dd.slug,\n        m.proposal_acct,\n        COUNT(*) OVER () as total_takes  -- Count all takes that match our filters\n    FROM \n        takes t\n        INNER JOIN orders o \n            ON o.order_tx_sig = t.order_tx_sig\n            AND o.market_acct IS NOT NULL \n            AND o.quote_price > 0\n        INNER JOIN transactions tx \n            ON tx.tx_sig = o.order_tx_sig\n            AND tx.failed IS FALSE\n        INNER JOIN markets m \n            ON m.market_acct = o.market_acct\n        INNER JOIN proposals p \n            ON p.proposal_acct = m.proposal_acct\n        INNER JOIN daos d \n            ON d.dao_acct = p.dao_acct\n        INNER JOIN tokens \n            ON tokens.mint_acct = d.base_acct\n        INNER JOIN dao_details dd \n            ON dd.dao_id = d.dao_id\n),\naggregated_stats AS (\n    SELECT \n        COUNT(DISTINCT actor_acct) AS unique_trader_count,\n        COUNT(DISTINCT proposal_acct) AS proposal_count,\n        COUNT(DISTINCT market_acct) AS market_count,\n        SUM(trade_volume) AS total_volume,\n        MAX(total_takes) AS total_trades,  -- Use MAX since the value is the same for all rows\n        COUNT(DISTINCT slug) AS dao_count\n    FROM base_trades\n)\nSELECT \n    total_volume::numeric AS volume_traded,\n    NULL::numeric AS profits_earned,\n    unique_trader_count::numeric AS unique_traders,\n    dao_count::numeric AS number_of_daos,\n    proposal_count::numeric AS total_proposals,\n    market_count::numeric AS total_markets,\n    total_trades::numeric\nFROM aggregated_stats;"
      returns: website_stats
      root_field_name: website_stats
    - arguments: {}
      code: "WITH base_trades_v0_3 AS (\r\n    SELECT \r\n        t.market_acct,\r\n        o.actor_acct,\r\n        (t.base_amount / POW(10, tokens.decimals)) * t.quote_price AS trade_volume,\r\n        dd.slug,\r\n        m.proposal_acct,\r\n        COUNT(*) OVER () as total_takes  -- Count all takes that match our filters\r\n    FROM \r\n        takes t\r\n        INNER JOIN orders o \r\n            ON o.order_tx_sig = t.order_tx_sig\r\n            AND o.market_acct IS NOT NULL \r\n            AND o.quote_price > 0\r\n        INNER JOIN transactions tx \r\n            ON tx.tx_sig = o.order_tx_sig\r\n            AND tx.failed IS FALSE\r\n        INNER JOIN markets m \r\n            ON m.market_acct = o.market_acct\r\n        INNER JOIN proposals p \r\n            ON p.proposal_acct = m.proposal_acct\r\n        INNER JOIN daos d \r\n            ON d.dao_acct = p.dao_acct\r\n        INNER JOIN tokens \r\n            ON tokens.mint_acct = d.base_acct\r\n        INNER JOIN dao_details dd \r\n            ON dd.dao_id = d.dao_id\r\n),\r\nbase_trades_v0_4 AS (\r\n    SELECT \r\n        s.amm_addr AS market_acct,\r\n        s.user_addr AS actor_acct,\r\n        CASE \r\n         WHEN s.swap_type = 'Buy' \r\n         \tTHEN (s.input_amount / POW(10, tokens.decimals))\r\n         ELSE (s.output_amount / POW(10, tokens.decimals))\r\n        END AS trade_volume,\r\n        o.slug,\r\n        p.proposal_addr AS proposal_acct,\r\n        COUNT(*) OVER () as total_takes\r\n    FROM \r\n        v0_4_swaps s\r\n        INNER JOIN v0_4_amms m \r\n            ON m.amm_addr = s.amm_addr\r\n        INNER JOIN v0_4_proposals p \r\n            ON p.pass_amm_addr = m.amm_addr OR p.fail_amm_addr = m.amm_addr\r\n        INNER JOIN v0_4_daos d \r\n            ON d.dao_addr = p.dao_addr\r\n        INNER JOIN tokens \r\n            ON tokens.mint_acct = d.usdc_mint_acct\r\n        INNER JOIN organizations o \r\n            ON o.organization_id = d.organization_id\r\n),\r\nmetric_swaps AS (\r\n    SELECT\r\n        user_addr,\r\n        input_amount,\r\n        output_amount,\r\n        block_time,\r\n        swap_type,\r\n        swap.signature,\r\n        merge.amount AS merge_amount,\r\n        split.amount AS split_amount,\r\n        md.amm_addr,\r\n\t\to.slug,\r\n\t\tCONCAT(md.id::VARCHAR, '-metric'::VARCHAR) as metric_decision_id --Add a `-metric` suffix to ensure uniqueness when we add more markets with a numeric ID\r\n    FROM v0_4_swaps swap\r\n\tINNER JOIN v0_4_metric_decisions md ON swap.amm_addr = md.amm_addr\r\n\tINNER JOIN dao_details dd ON md.dao_id = dd.dao_id\r\n\tINNER JOIN organizations o ON dd.organization_id = o.organization_id\r\n    LEFT JOIN v0_4_splits split ON split.signature = swap.signature\r\n    LEFT JOIN v0_4_merges merge ON merge.signature = swap.signature\r\n),\r\nmetric_splits AS (\r\n\tSELECT\r\n\t\tCASE WHEN swap_type = 'Sell'\r\n\t\tTHEN 'down'\r\n\t\tELSE 'up'\r\n\t\tEND AS asset,\r\n\t\toutput_amount + split_amount AS size,\r\n\t\t'buy' AS side,\r\n\t\tinput_amount AS base_amount,\r\n\t\tinput_amount / (output_amount + split_amount) AS price,\r\n\t\tsignature,\r\n\t\tuser_addr,\r\n\t\tblock_time,\r\n\t\tamm_addr,\r\n\t\tslug,\r\n\t\tmetric_decision_id\r\n\tFROM metric_swaps WHERE split_amount IS NOT NULL\r\n),\r\nmetric_merges AS (\r\n\tSELECT\r\n\t\tCASE WHEN swap_type = 'Buy'\r\n\t\tTHEN 'down'\r\n\t\tELSE 'up'\r\n\t\tEND AS asset,\r\n\t\tinput_amount + merge_amount AS size,\r\n\t\t'sell' AS side,\r\n\t\toutput_amount AS base_amount,\r\n\t\toutput_amount / (input_amount + merge_amount) AS price,\r\n\t\tsignature,\r\n\t\tuser_addr,\r\n\t\tblock_time,\r\n\t\tamm_addr,\r\n\t\tslug,\r\n\t\tmetric_decision_id\r\n\tFROM metric_swaps WHERE merge_amount IS NOT NULL\r\n),\r\nmetric_splits_merges AS (\r\n\tSELECT\r\n\t\tamm_addr AS market_acct,\r\n\t\tuser_addr AS actor_acct,\r\n\t\tsize / POW(10, 6) AS trade_volume,\r\n\t\tslug AS slug,\r\n\t\tmetric_decision_id AS proposal_acct\r\n\tFROM metric_splits UNION SELECT\r\n\t\tamm_addr AS market_acct,\r\n\t\tuser_addr AS actor_acct,\r\n\t\tsize / POW(10, 6) AS trade_volume,\r\n\t\tslug AS slug,\r\n\t\tmetric_decision_id AS proposal_acct\r\n\tFROM metric_merges\r\n),\r\nmetric_trades AS (\r\n\tSELECT\r\n\t\tmarket_acct,\r\n\t\tactor_acct,\r\n\t\ttrade_volume,\r\n\t\tslug,\r\n\t\tproposal_acct,\r\n\t\tCOUNT(*) OVER () as total_takes\r\n\tFROM metric_splits_merges\r\n),\r\nall_trades AS (\r\n\tSELECT * FROM base_trades_v0_3 \r\n\tUNION ALL SELECT * FROM base_trades_v0_4\r\n\tUNION ALL SELECT * from metric_trades\r\n),\r\naggregated_stats AS (\r\n    SELECT \r\n\t\tCOUNT(DISTINCT actor_acct) AS unique_trader_count,\r\n\t\tCOUNT(DISTINCT proposal_acct) AS proposal_count,\r\n\t\tCOUNT(DISTINCT market_acct) AS market_count,\r\n        SUM(trade_volume) AS total_volume,\r\n        MAX(total_takes) AS total_trades,\r\n\t\tCOUNT(DISTINCT slug) AS dao_count\r\n    FROM all_trades\r\n),\r\nusers_pnl AS (\r\n\tSELECT\r\n\t\tSUM(volume_bought_resolving_market - volume_sold_resolving_market)::NUMERIC AS total_pnl\r\n\tFROM user_performance\r\n\tWHERE volume_bought_resolving_market <> 'NaN' AND volume_sold_resolving_market <> 'NaN' --some columns in the table present as NaN, we can't do anything with those\r\n)\r\nSELECT \r\n    total_volume::numeric AS volume_traded,\r\n    (SELECT total_pnl FROM users_pnl) AS profits_earned,\r\n    unique_trader_count::numeric AS unique_traders,\r\n    dao_count::numeric AS number_of_daos,\r\n    proposal_count::numeric AS total_proposals,\r\n    market_count::numeric AS total_markets,\r\n    total_trades::numeric\r\nFROM aggregated_stats;"
      returns: website_stats
      root_field_name: website_stats_v2
  tables: "!include futarchy/tables/tables.yaml"
