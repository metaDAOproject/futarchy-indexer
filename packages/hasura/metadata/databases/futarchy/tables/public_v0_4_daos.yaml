table:
  name: v0_4_daos
  schema: public
object_relationships:
  - name: token
    using:
      foreign_key_constraint_on: token_mint_acct
  - name: tokenByUsdcMintAcct
    using:
      foreign_key_constraint_on: usdc_mint_acct
array_relationships:
  - name: v0_4_launches
    using:
      foreign_key_constraint_on:
        column: dao_addr
        table:
          name: v0_4_launches
          schema: public
  - name: v0_4_proposals
    using:
      foreign_key_constraint_on:
        column: dao_addr
        table:
          name: v0_4_proposals
          schema: public
