table:
  name: v0_4_daos
  schema: public
object_relationships:
  - name: organization
    using:
      foreign_key_constraint_on: organization_id
  - name: token
    using:
      foreign_key_constraint_on: token_mint_acct
  - name: tokenByUsdcMintAcct
    using:
      foreign_key_constraint_on: usdc_mint_acct
array_relationships:
  - name: dao_token_prices
    using:
      manual_configuration:
        column_mapping:
          token_mint_acct: market_acct
        insertion_order: null
        remote_table:
          name: prices
          schema: public
  - name: v0_4_launches
    using:
      foreign_key_constraint_on:
        column: dao_addr
        table:
          name: v0_4_launches
          schema: public
  - name: v0_4_proposals
    using:
      foreign_key_constraint_on:
        column: dao_addr
        table:
          name: v0_4_proposals
          schema: public
select_permissions:
  - role: anonymous
    permission:
      columns:
        - latest_dao_seq_num_applied
        - min_base_futarchic_liquidity
        - min_quote_futarchic_liquidity
        - organization_id
        - proposal_count
        - slots_per_proposal
        - twap_start_delay_slots
        - updated_at_slot
        - dao_addr
        - token_mint_acct
        - treasury_addr
        - usdc_mint_acct
        - twap_initial_observation
        - twap_max_observation_change_per_update
        - pass_threshold_bps
        - treasury_pda_bump
        - created_at
      filter: {}
    comment: ""
