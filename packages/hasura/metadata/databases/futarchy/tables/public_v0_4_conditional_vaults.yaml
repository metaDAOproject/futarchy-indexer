table:
  name: v0_4_conditional_vaults
  schema: public
object_relationships:
  - name: question
    using:
      foreign_key_constraint_on: question_addr
  - name: token_acct
    using:
      foreign_key_constraint_on: underlying_token_acct
  - name: underlying_mint
    using:
      foreign_key_constraint_on: underlying_mint_acct
array_relationships:
  - name: metric_decisions
    using:
      foreign_key_constraint_on:
        column: metric_vault_addr
        table:
          name: v0_4_metric_decisions
          schema: public
  - name: outcome_decisions
    using:
      foreign_key_constraint_on:
        column: outcome_vault_addr
        table:
          name: v0_4_metric_decisions
          schema: public
  - name: v04ProposalsByQuoteVaultAddr
    using:
      manual_configuration:
        column_mapping:
          conditional_vault_addr: quote_vault_addr
        insertion_order: null
        remote_table:
          name: v0_4_proposals
          schema: public
  - name: v0_4_merges
    using:
      foreign_key_constraint_on:
        column: vault_addr
        table:
          name: v0_4_merges
          schema: public
  - name: v0_4_proposals
    using:
      manual_configuration:
        column_mapping:
          conditional_vault_addr: base_vault_addr
        insertion_order: null
        remote_table:
          name: v0_4_proposals
          schema: public
  - name: v0_4_splits
    using:
      manual_configuration:
        column_mapping:
          conditional_vault_addr: vault_addr
        insertion_order: null
        remote_table:
          name: v0_4_splits
          schema: public
select_permissions:
  - role: anonymous
    permission:
      columns:
        - latest_vault_seq_num_applied
        - conditional_vault_addr
        - question_addr
        - underlying_mint_acct
        - underlying_token_acct
        - pda_bump
        - created_at
      filter: {}
    comment: ""
