table:
  name: v0_5_merges
  schema: public
object_relationships:
  - name: signatureBySignature
    using:
      foreign_key_constraint_on: signature
  - name: v0_4_conditional_vault
    using:
      manual_configuration:
        column_mapping:
          vault_addr: conditional_vault_addr
        insertion_order: null
        remote_table:
          name: v0_4_conditional_vaults
          schema: public
select_permissions:
  - role: anonymous
    permission:
      columns:
        - amount
        - vault_seq_num
        - signature
        - vault_addr
        - slot
        - created_at
      filter: {}
    comment: ""
