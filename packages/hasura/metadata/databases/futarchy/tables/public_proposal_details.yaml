table:
  name: proposal_details
  schema: public
object_relationships:
  - name: organization
    using:
      foreign_key_constraint_on: organization_id
  - name: proposal
    using:
      manual_configuration:
        column_mapping:
          proposal_acct: proposal_acct
        insertion_order: null
        remote_table:
          name: proposals
          schema: public
insert_permissions:
  - role: user
    permission:
      check: {}
      columns:
        - categories
        - content
        - description
        - base_cond_vault_acct
        - quote_cond_vault_acct
        - pass_market_acct
        - fail_market_acct
        - proposal_id
        - proposal_acct
        - proposer_acct
        - slug
        - title
    comment: ""
select_permissions:
  - role: anonymous
    permission:
      columns:
        - organization_id
        - proposal_id
        - proposal_index
        - base_cond_vault_acct
        - description
        - fail_market_acct
        - pass_market_acct
        - proposal_acct
        - proposer_acct
        - quote_cond_vault_acct
        - slug
        - title
        - categories
        - content
        - discussion_link
        - state
        - summary
      filter: {}
    comment: ""
  - role: proposer
    permission:
      columns:
        - organization_id
        - proposal_id
        - base_cond_vault_acct
        - description
        - fail_market_acct
        - pass_market_acct
        - proposal_acct
        - proposer_acct
        - quote_cond_vault_acct
        - slug
        - title
        - categories
        - content
        - discussion_link
        - state
        - summary
      filter: {}
    comment: ""
  - role: user
    permission:
      columns:
        - organization_id
        - proposal_id
        - base_cond_vault_acct
        - description
        - fail_market_acct
        - pass_market_acct
        - proposal_acct
        - proposer_acct
        - quote_cond_vault_acct
        - slug
        - title
        - categories
        - content
        - discussion_link
        - state
        - summary
      filter: {}
    comment: ""
update_permissions:
  - role: proposer
    permission:
      columns:
        - categories
        - content
        - description
        - proposal_acct
        - slug
        - title
      filter: {}
      check: null
    comment: ""
