table:
  name: v0_4_proposals
  schema: public
object_relationships:
  - name: proposal_details
    using:
      manual_configuration:
        column_mapping:
          proposal_addr: proposal_acct
        insertion_order: null
        remote_table:
          name: proposal_details
          schema: public
  - name: v04AmmByPassAmmAddr
    using:
      foreign_key_constraint_on: pass_amm_addr
  - name: v04ConditionalVaultByQuoteVaultAddr
    using:
      foreign_key_constraint_on: quote_vault_addr
  - name: v0_4_amm
    using:
      foreign_key_constraint_on: fail_amm_addr
  - name: v0_4_conditional_vault
    using:
      foreign_key_constraint_on: base_vault_addr
  - name: v0_4_dao
    using:
      foreign_key_constraint_on: dao_addr
  - name: v0_4_question
    using:
      foreign_key_constraint_on: question_addr
select_permissions:
  - role: anonymous
    permission:
      columns:
        - nonce
        - base_vault_addr
        - dao_addr
        - fail_amm_addr
        - pass_amm_addr
        - proposal_addr
        - proposer
        - question_addr
        - quote_vault_addr
        - state
        - number
        - instruction
        - fail_lp_tokens_locked
        - pass_lp_tokens_locked
        - slot_enqueued
        - pda_bump
        - description_url
        - created_at
      filter: {}
    comment: ""
