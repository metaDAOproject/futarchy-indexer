table:
  name: v0_5_launches
  schema: public
object_relationships:
  - name: launch_detail
    using:
      manual_configuration:
        column_mapping:
          launch_addr: launch_addr
        insertion_order: null
        remote_table:
          name: launch_details
          schema: public
  - name: token
    using:
      foreign_key_constraint_on: base_mint_acct
  - name: v0_5_dao
    using:
      foreign_key_constraint_on: dao_addr
array_relationships:
  - name: v0_5_claims
    using:
      foreign_key_constraint_on:
        column: launch_addr
        table:
          name: v0_5_claims
          schema: public
  - name: v0_5_funding_records
    using:
      foreign_key_constraint_on:
        column: launch_addr
        table:
          name: v0_5_funding_records
          schema: public
  - name: v0_5_funds
    using:
      foreign_key_constraint_on:
        column: launch_addr
        table:
          name: v0_5_funds
          schema: public
  - name: v0_5_refunds
    using:
      foreign_key_constraint_on:
        column: launch_addr
        table:
          name: v0_5_refunds
          schema: public
select_permissions:
  - role: anonymous
    permission:
      columns:
        - monthly_spending_limit_members
        - committed_amount
        - latest_launch_seq_num_applied
        - minimum_raise_amount
        - monthly_spending_limit_amount
        - unix_timestamp_started
        - updated_at_slot
        - is_hidden
        - base_mint_acct
        - dao_addr
        - launch_addr
        - launch_authority
        - launch_base_vault
        - launch_quote_vault
        - launch_signer
        - squads_multisig
        - squads_multisig_vault
        - state
        - seconds_for_launch
        - launch_signer_pda_bump
        - pda_bump
        - created_at
      filter: {}
    comment: ""
